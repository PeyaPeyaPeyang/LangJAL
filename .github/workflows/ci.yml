name: Build and test
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x64
            os: ubuntu-latest
            java-architecture: x64
          - asset: linux-aarch64
            os: ubuntu-24.04-arm
            java-architecture: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          architecture: ${{ matrix.java-architecture }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Free gradlew
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew :langjal:build
