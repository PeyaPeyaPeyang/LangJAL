name: JAL compiling/execution test
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-hello-world:
    name: Compile HelloWorld example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Free gradlew
        run: chmod +x ./gradlew
      - name: Build distribution
        run: ./gradlew :jalc:build :jalp:build createDistribution

      - name: Extract distribution
        run: |
          mkdir -p dist/langjal
          unzip build/distributions/langjal-*.zip -d dist/langjal
          chmod +x dist/langjal/bin/jalc.sh

      - name: Compile HelloWorld.jal
        run: |
          cd examples
          ../dist/langjal/bin/jalc.sh HelloWorld.jal --output outputs
          test -f outputs/HelloWorld.class
